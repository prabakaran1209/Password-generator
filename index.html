<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecurePass | Password Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🔐</div>
        <h1>Secure<span>Pass</span></h1>
        <p>Create strong and secure passwords instantly.</p>
    </div>

    <div class="generator-card">

        <div class="card-heading">
            <h2>Password Generator</h2>
            <span class="secure-badge">● SECURE</span>
        </div>

        <label class="section-label">Generated Password</label>

        <div class="password-box">
            <input type="text" id="password"
                   placeholder="Your password appears here"
                   readonly>

            <button id="copyBtn" onclick="copyPassword()">
                Copy
            </button>
        </div>

        <div class="strength-section">
            <div class="strength-info">
                <span>Password Strength</span>
                <span id="strengthText">Not generated</span>
            </div>

            <div class="strength-bar">
                <div id="strengthFill"></div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="length-header">
            <label>Password Length</label>
            <span id="lengthValue">16</span>
        </div>

        <input type="range" id="length"
               min="8" max="64" value="16">

        <div class="range-labels">
            <span>8 characters</span>
            <span>64 characters</span>
        </div>

        <h3>Customize Your Password</h3>

        <div class="options">

            <label class="option">
                <span>
                    <strong>Uppercase Letters</strong>
                    <small>A - Z</small>
                </span>
                <input type="checkbox" id="uppercase" checked>
            </label>

            <label class="option">
                <span>
                    <strong>Lowercase Letters</strong>
                    <small>a - z</small>
                </span>
                <input type="checkbox" id="lowercase" checked>
            </label>

            <label class="option">
                <span>
                    <strong>Numbers</strong>
                    <small>0 - 9</small>
                </span>
                <input type="checkbox" id="numbers" checked>
            </label>

            <label class="option">
                <span>
                    <strong>Symbols</strong>
                    <small>! @ # $ % & *</small>
                </span>
                <input type="checkbox" id="symbols" checked>
            </label>

        </div>

        <button class="generate-btn" onclick="generatePassword()">
            ✨ Generate Password
        </button>

        <p id="message"></p>

    </div>

    <footer>
        <p>SecurePass © 2026 | Your security matters.</p>
        <p>Passwords are generated locally by your Python backend.</p>
    </footer>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
