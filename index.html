
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090d1a">

    <meta name="description"
          content="Generate strong and secure passwords instantly with SecurePass.">

    <title>SecurePass - Password Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <div class="logo">🔐</div>
            <h1>Secure<span>Pass</span></h1>
            <p>Create strong and secure passwords instantly.</p>
        </header>

        <!-- Generator Card -->
        <section class="generator-card">

            <div class="card-heading">
                <h2>Password Generator</h2>
                <span class="secure-badge">● SECURE</span>
            </div>

            <!-- Password Output -->
            <label class="section-label" for="password">
                Generated Password
            </label>

            <div class="password-box">
                <input
                    type="text"
                    id="password"
                    placeholder="Your password appears here"
                    readonly
                    aria-label="Generated password"
                >

                <button id="copyBtn" class="copy-btn" type="button">
                    Copy
                </button>
            </div>

            <!-- Strength Meter -->
            <div class="strength-section">

                <div class="strength-info">
                    <span>Password Strength</span>
                    <span id="strengthText">Not generated</span>
                </div>

                <div
                    class="strength-bar"
                    role="progressbar"
                    aria-label="Password strength"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                    id="strengthBar"
                >
                    <div id="strengthFill"></div>
                </div>

            </div>

            <div class="divider"></div>

            <!-- Password Length -->
            <div class="length-header">
                <label for="length">Password Length</label>
                <span id="lengthValue">16</span>
            </div>

            <input
                type="range"
                id="length"
                min="8"
                max="64"
                value="16"
            >

            <div class="range-labels">
                <span>8 characters</span>
                <span>64 characters</span>
            </div>

            <!-- Customization -->
            <h3>Customize Your Password</h3>

            <div class="options">

                <label class="option">
                    <span>
                        <strong>Uppercase Letters</strong>
                        <small>A - Z</small>
                    </span>
                    <input type="checkbox" id="uppercase" checked>
                </label>

                <label class="option">
                    <span>
                        <strong>Lowercase Letters</strong>
                        <small>a - z</small>
                    </span>
                    <input type="checkbox" id="lowercase" checked>
                </label>

                <label class="option">
                    <span>
                        <strong>Numbers</strong>
                        <small>0 - 9</small>
                    </span>
                    <input type="checkbox" id="numbers" checked>
                </label>

                <label class="option">
                    <span>
                        <strong>Symbols</strong>
                        <small>! @ # $ % & *</small>
                    </span>
                    <input type="checkbox" id="symbols" checked>
                </label>

            </div>

            <!-- Generate Button -->
            <button id="generateBtn" class="generate-btn" type="button">
                ✨ Generate Password
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </section>

        <!-- Footer -->
        <footer>
            <p>SecurePass © 2026 | Your security matters.</p>
            <p>Passwords are generated securely in your browser.</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
